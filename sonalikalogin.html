<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap");
    *{
        box-sizing: border-box;
    }
        body,html{
            margin: 0;
            padding: 0;
            font-family: "Noto Sans", sans-serif;
            background-image: url(sonalikabackground.png);
             min-height: 100vh;
            background-size: cover;  
            background-position: center; 
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .page{
            width:100% ;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.2);
        }
        .container{
            display: flex;
            flex-direction: column;
            width: 400px;
            padding: 30px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            border-radius: 15px;
            gap: 15px;
        }
        h2{
            font-size:21px;
            font-weight:800;
            color: white;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.4);
            text-align: center;
        }
        input{
            padding: 5px;
            border: 1.5px solid rgba(255,255,255,0.4);
            border-radius: 8px;
            background: rgba(255,255,255,0.9);
            color: #1a1a1a;
            font-size: 15px;
            outline: none;
        }
        .login-btn{
            padding: 5px;
            border: none;
            border-radius: 8px;
            background: #1c66b5;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
        }
        .login-btn:hover{
            background-color:  #003d80;
        }
        .container img{
            width: 180px;
            align-self: center;
        }
         #message{
        text-align:center;
        font-weight:bold;
        min-height:20px;
        text-shadow: 1px 1px 0 black;
        margin:0;
        }

        .success{
            color:lightgreen;
        }

        .error{
            color:#ff4d4d;
        }
        .remember{
        display: flex;
        align-items: center;
        gap: 8px;
        color: white;
        font-size: 14px;
    }
        @media(max-width: 480px){
       
       .container{
           max-width: 300px;
           height: 400px;
        }
        .container img{
            width: 150px;
            align-self: center;
        }
        .login-btn:hover,input{
            padding: 3px;
            font-size: 14px;
        }
        .footer{
            margin-bottom: 0;
        }
       
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="container">
            <img src="sonalikalogo.jpg" alt="" srcset="">
            <h2>Employee Management System</h2>
            <input type="text" id="empCode" placeholder="Enter EmpCode">
<input type="password" id="password" placeholder="Enter Password">
<p id="message"></p>
<label class="remember">
    <input type="checkbox" id="rememberMe">
    Remember Me
</label>
<button type="button" class="login-btn" onclick="login()">
    Login
</button>

    <script>
const empCodeInput = document.getElementById("empCode");
const passwordInput = document.getElementById("password");
const message = document.getElementById("message");
const loginBtn = document.querySelector(".login-btn");
const rememberMe = document.getElementById("rememberMe");

// Autofocus
window.onload = function () {
    empCodeInput.focus();

    // Load saved EmpCode if Remember Me was checked
    if (localStorage.getItem("rememberMe") === "true") {
        empCodeInput.value = localStorage.getItem("empCode") || "";
        rememberMe.checked = true;
    }
};

// Press Enter to Login
document.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
        login();
    }
});

function showMessage(text, type) {
    message.innerText = text;
    message.className = type;
}

async function login() {

    const empCode = empCodeInput.value.trim();
    const password = passwordInput.value.trim();

    if (empCode === "" || password === "") {
        showMessage("Please fill all fields.", "error");
        return;
    }

    loginBtn.disabled = true;
    loginBtn.innerText = "Logging in...";

    try {

        const response = await fetch("https://localhost:7104/api/Login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                empCode: empCode,
                password: password
            })
        });

        const data = await response.json();

       if (response.ok) {

    console.log(data);

    localStorage.setItem("token", data.token);
    localStorage.setItem("empCode", empCode);

    if (rememberMe.checked) {
        localStorage.setItem("empCode", empCode);
        localStorage.setItem("rememberMe", "true");
    } else {
        localStorage.removeItem("empCode");
        localStorage.removeItem("rememberMe");
    }

    showMessage("Login Successful", "success");

setTimeout(() => {
    window.location.href = "dashboard.html";
}, 1000);
}
else {

    showMessage(data.message, "error");

}

    } 
    catch (error) {

    console.error(error);

    showMessage("Unable to connect to server.", "error");

}

    loginBtn.disabled = false;
    loginBtn.innerText = "Login";
}
</script>

</body>
</html>
